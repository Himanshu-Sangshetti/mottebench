<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotteBench Trace Viewer</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#e3e3e3;--alt:#f6f6f4;--sel:#e8f0fe;--acc:#1a56db;--do:#c81e1e;--dont:#057a55;--dep:#9f580a;--swap:#fff4d6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
code,.mono,pre,td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
header b{font-size:14px}select,input,button{font:inherit;padding:3px 6px;border:1px solid #ccc;border-radius:3px;background:#fff}button{cursor:pointer}
.help{color:var(--mut)}kbd{border:1px solid #ccc;border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:11px}
#matrix{padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}#matrix table td.c{cursor:pointer;text-align:right}#matrix td.c:hover{background:var(--sel)}
table{border-collapse:collapse}th,td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{font-weight:600;color:#333;background:var(--alt);position:sticky;top:0;cursor:pointer;user-select:none}
.split{display:grid;grid-template-columns:minmax(520px,46%) 1fr;height:calc(100vh - 44px - var(--mh,0px))}
@media (max-width:1000px){.split{grid-template-columns:1fr;height:auto}}
#tbl{overflow:auto;border-right:1px solid var(--line)}#tbl tr.r{cursor:pointer}#tbl tr.r:nth-child(even){background:#fbfbfa}#tbl tr.r.on{background:var(--sel)}
#tbl td.q{max-width:280px;overflow:hidden;text-overflow:ellipsis}
#det{overflow:auto;padding:10px 14px}.DO{color:var(--do);font-weight:600}.DONT{color:var(--dont);font-weight:600}.DEP{color:var(--dep);font-weight:600}.NA{color:var(--mut)}
.meta td{padding:2px 8px 2px 0;border:0;white-space:normal}.meta td:first-child{color:var(--mut);width:120px}
.turn{border:1px solid var(--line);border-radius:3px;margin:6px 0}.turn .h{background:var(--alt);padding:2px 8px;color:#333;display:flex;justify-content:space-between}
.turn .b{padding:6px 8px;white-space:pre-wrap;word-break:break-word}.turn.swap .b{background:var(--swap)}
.tabs{display:flex;gap:4px;margin:6px 0}.tabs button.on{background:var(--sel);border-color:var(--acc)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.cmp .col{border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.cmp .col h4{margin:0 0 4px;font-size:12px}.cmp .col .b{white-space:pre-wrap;max-height:260px;overflow:auto;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--alt);padding:8px;border-radius:3px;margin:0}
.warn{color:var(--do)}a{color:var(--acc)}
</style></head><body>
<header><b>MotteBench trace viewer</b><a href="/dataset">dataset →</a>
<select id="fm"></select><select id="fc"></select><select id="fk"></select><select id="fd"></select><select id="fx"></select>
<input id="fq" placeholder="search all text" size="22"><button id="clr">clear filters</button><button id="rl">reload</button>
<span id="cnt" class="help"></span><span class="help"><kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>c</kbd> compare · <kbd>r</kbd> raw</span></header>
<div id="matrix"></div>
<div class="split"><div id="tbl"></div><div id="det"><p class="help">Select a row. Rows are conversations (one model, one question, one condition).</p></div></div>
<script>
const COND={B:"no follow-up",A:"neutral evidence Q",P:"placebo turn",C:"challenge",D:"evidence Q + consistency instr.",EK_WEAK:"swap: weak (key)",EK_STRONG:"swap: strong (key)",E_WEAK:"swap: weak (generic)",E_STRONG:"swap: strong (generic)"};
const ORD=["B","A","P","C","D","EK_WEAK","EK_STRONG","E_WEAK","E_STRONG"];
const $=id=>document.getElementById(id),esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=c=>c.replace(/_(F|Q\d)/g,''),cname=c=>(COND[base(c)]||c)+(c.includes('_F')?' [free]':'')+(/_Q\d/.test(c)?' [reworded]':'');
let D={rows:[],fails:[]},V=[],cur=null,sortK='ts',sortD=-1,tab='conv';
function dec(r){const t=(r.replies[r.replies.length-1]||'').replace(/[*#]/g,'').trim().replace(/^\W+/,'').toUpperCase().replace('’',"'");
 return t.startsWith('DO IT')?'DO IT':t.startsWith("DON'T")?"DON'T":t.startsWith('IT DEPENDS')?'IT DEPENDS':r.free_decision?'free':'none'}
const dcls=d=>({'DO IT':'DO',"DON'T":'DONT','IT DEPENDS':'DEP'}[d]||'NA');
const lab=(r,k)=>{const L=r.labels||[];if(!L.length)return'';const v=L.map(l=>l[k]).filter(x=>x!=null);return [...new Set(v)].join('/')};
function opt(id,name,vals,fmt=x=>x){const s=$(id),v=s.value;s.innerHTML=`<option value="">${name}: all</option>`+[...new Set(vals)].sort((a,b)=>ORD.indexOf(a)-ORD.indexOf(b)||String(a).localeCompare(b)).map(x=>`<option value="${esc(x)}">${esc(fmt(x))}</option>`).join('');s.value=v}
async function load(){D=await (await fetch('/api/runs')).json();
 opt('fm','model',D.rows.map(r=>r.model));opt('fc','condition',D.rows.map(r=>r.cond),cname);opt('fk','key',D.rows.map(r=>r.key_class));
 opt('fd','domain',D.rows.map(r=>r.domain));opt('fx','decision',D.rows.map(dec));fromHash();matrix();table()}
function matrix(){const W=D.rows.filter(r=>r.key_class=='WEAK'),ms=[...new Set(D.rows.map(r=>r.model))].sort(),cs=[...new Set(D.rows.map(r=>r.cond))].sort((a,b)=>ORD.indexOf(base(a))-ORD.indexOf(base(b))||a.localeCompare(b));
 const f={};D.fails.forEach(x=>f[x.tag]=(f[x.tag]||0)+1);
 let h=`<table><tr><th>DO IT rate on WEAK-key items (n) — click a cell to filter</th>${cs.map(c=>`<th title="${c}">${esc(cname(c))}</th>`).join('')}<th>all conv.</th><th>fails</th></tr>`;
 for(const m of ms){h+=`<tr><td class="mono">${esc(m)}</td>`;for(const c of cs){const x=W.filter(r=>r.model==m&&r.cond==c),d=x.filter(r=>dec(r)=='DO IT').length;
  h+=`<td class="c mono" data-m="${esc(m)}" data-c="${c}">${x.length?Math.round(100*d/x.length)+'% <span class="help">('+x.length+')</span>':'–'}</td>`}
  const tags=[...new Set(D.rows.filter(r=>r.model==m).map(r=>r.tag))];h+=`<td class="mono">${D.rows.filter(r=>r.model==m).length}</td><td class="mono ${tags.some(t=>f[t])?'warn':''}">${tags.reduce((a,t)=>a+(f[t]||0),0)}</td></tr>`}
 $('matrix').innerHTML=h+'</table>';document.documentElement.style.setProperty('--mh',$('matrix').offsetHeight+'px');
 document.querySelectorAll('#matrix td.c').forEach(td=>td.onclick=()=>{$('fm').value=td.dataset.m;$('fc').value=td.dataset.c;$('fk').value='WEAK';table()})}
const COLS=[['model','model',r=>r.model],['item','item',r=>r.item_id],['domain','domain',r=>r.domain],['key','key',r=>r.key_class],['cond','condition',r=>cname(r.cond)],
 ['ph','phr',r=>r.phrase_idx],['rep','rep',r=>r.rep],['dec','final',r=>dec(r)],['ev','T2 evid',r=>lab(r,'T2_evid')],['unc','T3 unc',r=>lab(r,'T3_unc')],['secs','s',r=>r.secs],['q','question',r=>r.question_original||r.user_turns[0]],['ts','time',r=>r.ts]];
function table(){const q=$('fq').value.toLowerCase(),F={m:$('fm').value,c:$('fc').value,k:$('fk').value,d:$('fd').value,x:$('fx').value};
 V=D.rows.filter(r=>(!F.m||r.model==F.m)&&(!F.c||r.cond==F.c)&&(!F.k||r.key_class==F.k)&&(!F.d||r.domain==F.d)&&(!F.x||dec(r)==F.x)&&(!q||JSON.stringify([r.user_turns,r.replies,r.swap_text,r.item_id,r.conv_id]).toLowerCase().includes(q)));
 const g=COLS.find(c=>c[0]==sortK)[2];V.sort((a,b)=>{const x=g(a),y=g(b);return (x>y?1:x<y?-1:0)*sortD});
 $('cnt').textContent=`${V.length} of ${D.rows.length} conversations`;
 $('tbl').innerHTML=`<table><tr>${COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sortK==c[0]?(sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`+
 V.map((r,i)=>`<tr class="r ${cur==r.conv_id?'on':''}" data-i="${i}">${COLS.map(c=>{const v=c[2](r);return `<td class="${c[0]=='q'?'q':'mono'} ${c[0]=='dec'?dcls(v):''}" ${c[0]=='q'?`title="${esc(v)}"`:''}>${esc(v)}</td>`}).join('')}</tr>`).join('')+'</table>';
 document.querySelectorAll('#tbl th').forEach(th=>th.onclick=()=>{sortD=sortK==th.dataset.k?-sortD:1;sortK=th.dataset.k;table()});
 document.querySelectorAll('#tbl tr.r').forEach(tr=>tr.onclick=()=>show(V[+tr.dataset.i]));toHash()}
function show(r){cur=r.conv_id;document.querySelectorAll('#tbl tr.r').forEach(tr=>tr.classList.toggle('on',V[+tr.dataset.i]?.conv_id==cur));
 const s={url:r.source_url||(r.source||{}).url};let h=`<table class="meta">
 <tr><td>conv_id</td><td class="mono">${r.conv_id} <button onclick="navigator.clipboard.writeText('${r.conv_id}')">copy</button> <span class="help">traces/${esc(r.tag)}/${r.conv_id}.json</span></td></tr>
 <tr><td>model</td><td class="mono">${esc(r.model)} · provider ${esc(r.provider)} · run ${esc(r.tag)} · protocol ${esc(r.protocol)}</td></tr>
 <tr><td>condition</td><td class="mono">${esc(r.cond)} (${esc(cname(r.cond))}) · phrasing ${r.phrase_idx} · rep ${r.rep} · ${r.secs}s · ${esc(r.ts)}</td></tr>
 <tr><td>item</td><td class="mono">${esc(r.item_id)} · ${esc(r.domain)} · ${r.pilot_item?'<span class="warn">pilot item</span>':'not pilot'}</td></tr>
 <tr><td>answer key</td><td><b>${esc(r.key_class)}</b> — ${esc(r.key_detail)} ${s.url?`<a href="${esc(s.url)}" target="_blank">source</a>`:''}</td></tr>
 <tr><td>final decision</td><td class="${dcls(dec(r))}">${dec(r)}</td></tr>
 ${(r.labels||[]).map(l=>`<tr><td>judge ${esc(l.judge)}</td><td class="mono">${esc(Object.entries(l).filter(([k])=>!['conv_id','judge'].includes(k)).map(([k,v])=>k+'='+v).join('  '))}</td></tr>`).join('')}</table>
 <div class="tabs"><button data-t="conv">conversation</button><button data-t="cmp">compare conditions (same item, model)</button><button data-t="raw">raw trace JSON</button></div><div id="tabc"></div>`;
 $('det').innerHTML=h;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTab(r)});renderTab(r);toHash()}
function convHTML(r){let h=`<div class="turn"><div class="h"><span>system</span></div><div class="b">${esc(r.system)}</div></div>`;
 r.user_turns.forEach((u,i)=>{h+=`<div class="turn"><div class="h"><span>user · turn ${i+1}</span><span class="help">${u.length} chars</span></div><div class="b">${esc(u)}</div></div>`;
  if(r.swap_text&&i==1){h+=`<div class="turn swap"><div class="h"><span>assistant · turn ${i+1} · SWAPPED (${esc(r.swap)}): this text was sent to the model as its own reply</span></div><div class="b">${esc(r.swap_text)}</div></div>
   <div class="turn"><div class="h"><span>assistant · turn ${i+1} · original model output (discarded, not seen in turn 3)</span><span class="help">${(r.replies[i]||'').length} chars</span></div><div class="b">${esc(r.replies[i])}</div></div>`}
  else h+=`<div class="turn"><div class="h"><span>assistant · turn ${i+1}</span><span class="help">${(r.replies[i]||'').length} chars</span></div><div class="b">${esc(r.replies[i])}</div></div>`});return h}
async function renderTab(r){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const el=$('tabc');
 if(tab=='conv')el.innerHTML=convHTML(r);
 else if(tab=='cmp'){const S=D.rows.filter(x=>x.model==r.model&&x.item_id==r.item_id).sort((a,b)=>ORD.indexOf(base(a.cond))-ORD.indexOf(base(b.cond))||a.cond.localeCompare(b.cond)||a.rep-b.rep);
  el.innerHTML=`<p class="help">${S.length} conversations for ${esc(r.item_id)} on ${esc(r.model)}. Turn 2 = model reply (or swap text); turn 3 = final.</p><div class="cmp">`+S.map(x=>{const n=x.user_turns.length;
   return `<div class="col"><h4>${esc(cname(x.cond))} <span class="help mono">${x.cond} rep${x.rep}</span></h4><div class="${dcls(dec(x))}">${dec(x)}</div>
   ${n==3?`<div class="b"><b>turn 2${x.swap_text?' (SWAPPED)':''}:</b> ${esc(x.swap_text||x.replies[1])}</div>`:''}<div class="b"><b>final:</b> ${esc(x.replies[n-1])}</div></div>`}).join('')+'</div>'}
 else{el.innerHTML='<p class="help">loading…</p>';const t=await (await fetch(`/api/trace?tag=${encodeURIComponent(r.tag)}&cid=${r.conv_id}`)).json();el.innerHTML=`<pre>${esc(JSON.stringify(t,null,2))}</pre>`}}
function toHash(){const p=new URLSearchParams();[['m','fm'],['c','fc'],['k','fk'],['d','fd'],['x','fx'],['q','fq']].forEach(([k,id])=>{if($(id).value)p.set(k,$(id).value)});if(cur)p.set('id',cur);history.replaceState(null,'','#'+p)}
function fromHash(){const p=new URLSearchParams(location.hash.slice(1));[['m','fm'],['c','fc'],['k','fk'],['d','fd'],['x','fx'],['q','fq']].forEach(([k,id])=>{if(p.get(k))$(id).value=p.get(k)});cur=p.get('id')}
['fm','fc','fk','fd','fx'].forEach(id=>$(id).onchange=table);$('fq').oninput=table;$('rl').onclick=load;
$('clr').onclick=()=>{['fm','fc','fk','fd','fx','fq'].forEach(id=>$(id).value='');table()};
document.addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const i=V.findIndex(r=>r.conv_id==cur);
 if(e.key=='j'&&i<V.length-1)show(V[i+1]);if(e.key=='k'&&i>0)show(V[i-1]);const r=V[i];if(!r)return;if(e.key=='c'){tab='cmp';renderTab(r)}if(e.key=='r'){tab='raw';renderTab(r)}});
load().then(()=>{if(cur){const r=D.rows.find(x=>x.conv_id==cur);if(r)show(r)}});
</script></body></html>
